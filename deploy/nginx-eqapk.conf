# Server block para eqapk.recepcioneq.com
# Se agrega al final de /home/ubuntu/recepcioneq/nginx/nginx.conf
# (el mismo archivo donde vive el block de api.recepcioneq.com).
#
# IMPORTANTE: el block HTTPS de abajo referencia un certificado que todavia no
# existe. Seguir el orden de deploy/README.md: primero solo el block :80, emitir
# el cert con certbot, y RECIEN AHI pegar el block :443 y recargar nginx.

# HTTP -> HTTPS + challenge ACME
server {
    listen 80;
    server_name eqapk.recepcioneq.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS -> proxy al contenedor eqapk-api
server {
    listen 443 ssl http2;
    server_name eqapk.recepcioneq.com;

    ssl_certificate     /etc/letsencrypt/live/eqapk.recepcioneq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eqapk.recepcioneq.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-XSS-Protection          "1; mode=block"                       always;

    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 256;

    location / {
        proxy_pass         http://eqapk-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10m;
    }
}
